<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Base App Tile -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="10" opacity="0.55"/>

  <!-- Stylized Schedule / Calendar Body -->
  <rect x="104" y="124" width="248" height="248" rx="44" fill="#131c38" stroke="url(#accentGrad)" stroke-width="22"/>
  <path d="M104 196 H352" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Top Calendar Pins -->
  <line x1="168" y1="92" x2="168" y2="144" stroke="#38bdf8" stroke-width="22" stroke-linecap="round"/>
  <line x1="288" y1="92" x2="288" y2="144" stroke="#a855f7" stroke-width="22" stroke-linecap="round"/>

  <!-- Schedule Grid Dots -->
  <circle cx="166" cy="248" r="13" fill="#38bdf8"/>
  <circle cx="228" cy="248" r="13" fill="#818cf8"/>
  <circle cx="166" cy="306" r="13" fill="#818cf8"/>

  <!-- Clock / Automation Badge Overlapping Bottom-Right -->
  <circle cx="332" cy="324" r="92" fill="#0f172a" stroke="url(#sparkGrad)" stroke-width="22"/>
  <path d="M332 276 V324 L366 346" fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Launch / Paper Plane Spark Top-Right -->
  <path d="M356 100 L424 132 L370 156 L356 210 L336 154 L284 136 Z" fill="url(#sparkGrad)"/>
</svg>
